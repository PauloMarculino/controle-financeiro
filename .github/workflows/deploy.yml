name: Deploy to Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies and build
      run: |
        cd frontend-novo
        npm install
        npm run build

    # ▼▼▼ BLOCO ALTERADO ▼▼▼
    - name: FTP Deploy Frontend
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./frontend-novo/dist/
        server-dir: ./public_html/controle-financeiro/
        dangerous-clean-slate: true # <-- ADICIONAMOS ESTA LINHA

    - name: FTP Deploy Backend
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./backend/
        server-dir: ./public_html/controle-financeiro/backend/